[project]
name = "saturn"
version = "0.1.0"
description = "Saturn is a modern lightweight GPU-accelerated UI framework."
requires-python = ">=3.10"
dependencies = [
    "brotli>=1.1.0",
    "fonttools>=4.65.0",
    "moderngl>=5.12.0",
    "pyperclip>=1.11.0",
    "pygame-ce>=2.5.8",
    "saturn-fonts-cjk>=0.1.0,<0.2.0",
    "saturn-icons-material>=0.1.0,<0.2.0",
    "vulkan>=1.3.275.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[[project.authors]]
name = "Stevesuk"
email = "stevesukawa@outlook.com"

[project.urls]
Homepage = "https://github.com/the-OmegaLabs/Saturn"
Repository = "https://github.com/the-OmegaLabs/Saturn"

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
saturn-fonts-cjk = { workspace = true }
saturn-icons-material = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.build-backend]
module-name = "saturn"
module-root = ""
